name: Build JARVIS APK (Part 9)

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
    paths:
      - "Part 9/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "Part 9"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "JARVIS-${GITHUB_REF_NAME}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Part9-debug-apk
          path: "Part 9/JARVIS-*.apk"
          if-no-files-found: error

      - name: Publish GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: "Part 9/JARVIS-*.apk"
          generate_release_notes: true
