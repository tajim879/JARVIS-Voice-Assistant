name: Build JARVIS PC Agent (exe)

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
    paths:
      - "Part 11/pc-agent/**"
      - ".github/workflows/build-pc-agent.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: "Part 11/pc-agent"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install cryptography pyinstaller

      - name: Build the exe
        run: pyinstaller --onefile --name JARVIS-PC-Agent --console jarvis_pc_agent.py

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-PC-Agent-exe
          path: "Part 11/pc-agent/dist/JARVIS-PC-Agent.exe"
          if-no-files-found: error

      - name: Publish GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: "Part 11/pc-agent/dist/JARVIS-PC-Agent.exe"
          generate_release_notes: true
